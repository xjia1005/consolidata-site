# Merge only into the cdatats.com HTTPS server, before its static locations.
# Inspect the exact resulting config and nginx -t before any reload.
location = /api/checkup { return 404; }
location ^~ /api/checkup/ {
    access_log off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    proxy_pass http://127.0.0.1:4190;
    proxy_http_version 1.1;
    proxy_set_header Host cdatats.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 35s;
    proxy_buffering off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
}
